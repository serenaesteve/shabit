# Web estática de presentación y descarga de la app Android shabit.
<Directory /var/www/shabit>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<VirtualHost *:443>
    ServerName shabit.serenaesteve.com
    DocumentRoot /var/www/shabit
    DirectoryIndex index.html
    ErrorDocument 404 /404.html

    # Servidor de recordatorios (shabit-avisos, solo en 127.0.0.1:8102)
    ProxyPass /api/ http://127.0.0.1:8102/api/
    ProxyPassReverse /api/ http://127.0.0.1:8102/api/

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/shabit.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shabit.serenaesteve.com/privkey.pem

    AddDefaultCharset UTF-8
    # Web app para iPhone en /app/: manifiesto y service worker (siempre fresco, para recibir versiones nuevas)
    AddType application/manifest+json .webmanifest
    # El APK se descarga como app de Android, no como un zip
    AddType application/vnd.android.package-archive .apk
    <FilesMatch "\.apk$">
        Header set Content-Disposition "attachment"
        Header set Cache-Control "no-cache"
    </FilesMatch>

    Header set Cache-Control "no-cache"
    <FilesMatch "\.(png|webp|woff2|svg)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/manifest+json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/shabit-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/shabit-ssl-access.log combined
</VirtualHost>
