# shabit en shabit.serenaesteve.com: en el puerto 80 solo se verifica el certificado y se redirige a HTTPS.
<VirtualHost *:80>
    ServerName shabit.serenaesteve.com

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://shabit.serenaesteve.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/shabit-error.log
    CustomLog ${APACHE_LOG_DIR}/shabit-access.log combined
</VirtualHost>
